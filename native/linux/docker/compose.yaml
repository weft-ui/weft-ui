# Linux desktop with the workspace mounted at /workspace:
#
#   docker compose -f native/linux/docker/compose.yaml up -d --build
#   docker compose -f native/linux/docker/compose.yaml exec linux bash
#
# Then, in the container: `pnpm install`, `native/linux/build-core.sh`,
# `pnpm --filter example build:linux` and `pnpm --filter example test:linux`.
# The compiler WASM (packages/compiler/wasm) comes from the host's
# `pnpm build:wasm`.
#
# The XFCE session is on vnc://localhost:5901 (password `weft`); apps and UI
# tests started in the container show up there. The workspace's
# node_modules directories are separate volumes, so `pnpm install` in the
# container installs Linux packages without touching the host's.
#
# The `web` service records the showcase's Web screenshots in headless
# Chromium (web.Dockerfile). It shares the workspace and its volumes:
#
#   docker compose -f native/linux/docker/compose.yaml run --rm web \
#     sh -c 'pnpm install && pnpm --filter showcase shot:web'
services:
  linux: &workspace
    build: .
    image: weft-linux
    init: true
    working_dir: /workspace
    environment:
      # Keep pnpm's store in its volume: by default pnpm puts it next to the
      # project when the store and node_modules are on different file systems.
      # pnpm 11 reads only `pnpm_config_*` variables.
      pnpm_config_store_dir: /home/ubuntu/.local/share/pnpm/store
      # Let a non-interactive `pnpm install` (`exec` without a TTY) recreate
      # node_modules when it was installed with another store or layout; pnpm
      # 11 ignores `confirmModulesPurge` from the environment.
      CI: "true"
    ports:
      - "127.0.0.1:5901:5901"
    volumes:
      - ../../..:/workspace
      - node_modules:/workspace/node_modules
      - compiler_modules:/workspace/packages/compiler/node_modules
      - platform_modules:/workspace/packages/platform/node_modules
      - runtime_modules:/workspace/packages/runtime/node_modules
      - vite_modules:/workspace/packages/vite/node_modules
      - native_apple_modules:/workspace/native/apple/node_modules
      - native_android_modules:/workspace/native/android/node_modules
      - native_windows_modules:/workspace/native/windows/node_modules
      - native_linux_modules:/workspace/native/linux/node_modules
      - example_modules:/workspace/example/node_modules
      - showcase_modules:/workspace/showcase/node_modules
      - tests_modules:/workspace/tests/node_modules
      - pnpm_store:/home/ubuntu/.local/share/pnpm

  web:
    <<: *workspace
    build:
      context: .
      dockerfile: web.Dockerfile
    image: weft-web
    ports: []

volumes:
  node_modules:
  compiler_modules:
  platform_modules:
  runtime_modules:
  vite_modules:
  native_apple_modules:
  native_android_modules:
  native_windows_modules:
  native_linux_modules:
  example_modules:
  showcase_modules:
  tests_modules:
  pnpm_store:
