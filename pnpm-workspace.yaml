packages:
  - docs
  - packages/*
  - native/apple
  - native/android
  - native/windows
  - native/linux
  - example
  - tests

# Scripts such as `WEFT_PLATFORM=windows vite build` also run on Windows hosts.
shellEmulator: true

# Accept freshly published versions, as local installs do.
minimumReleaseAge: 0

# miniprogram-automator's core-js 2 dependency needs no install step.
allowBuilds:
  core-js: false
