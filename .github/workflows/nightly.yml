# Run the example's Android and iOS UI flows and Web, iOS and
# Android screenshot regressions nightly and on demand. WeChat and desktop
# screenshots, and the Windows and Linux UI flows, run only locally; see
# CONTRIBUTING.md.
name: Nightly

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Keep in sync with crates/wasm/Cargo.toml.
  WASM_BINDGEN: 0.2.130
  # Keep in sync with WEFT_HERMES_TAG in native/core/CMakeLists.txt. The kernel
  # caches are keyed on it and on the Hermes options in native/core/hermes.cmake.
  HERMES_TAG: hermes-v260318099.0.8

jobs:
  # A scheduled run is skipped when master has not moved since the last
  # successful nightly run; manual runs always go ahead.
  changed:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list -R "$GITHUB_REPOSITORY" --workflow nightly.yml --branch master --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$last" = "$GITHUB_SHA" ]; then
            echo "master is still at $last, which passed the last nightly run"
            echo run=false >> "$GITHUB_OUTPUT"
          else
            echo run=true >> "$GITHUB_OUTPUT"
          fi

  wasm:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN }}
      - run: cargo build -p weft-ui-wasm --release --target wasm32-unknown-unknown
      - run: wasm-bindgen --target web --out-dir packages/compiler/wasm --out-name weft_ui_wasm target/wasm32-unknown-unknown/release/weft_ui_wasm.wasm
      - uses: actions/upload-artifact@v7
        with:
          name: compiler-wasm
          path: packages/compiler/wasm
          retention-days: 3

  android-ui:
    needs: wasm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/cache@v6
        with:
          path: |
            native/core/build
            native/android/build
          key: android-${{ env.HERMES_TAG }}-${{ hashFiles('native/core/hermes.cmake', 'native/android/CMakeLists.txt', 'native/android/build-core.sh') }}
          restore-keys: android-${{ env.HERMES_TAG }}-
      - run: native/android/build-core.sh
        env:
          WEFT_ANDROID_ABIS: x86_64
      - run: pnpm --filter example build:android
        env:
          WEFT_NATIVE: "0"
      # Resolve plugins and compile before the emulator starts, as in
      # android-shots: Gradle running next to the emulator starves both.
      - run: example/apps/android/gradlew -p example/apps/android :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: pnpm --filter example test:android

  ios-ui:
    needs: wasm
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: brew install ninja
      - uses: actions/cache@v6
        with:
          path: |
            native/core/build
            native/apple/build
          key: apple-ios-${{ env.HERMES_TAG }}-${{ hashFiles('native/core/hermes.cmake', 'native/apple/build-core.sh') }}
          restore-keys: apple-ios-${{ env.HERMES_TAG }}-
      - run: native/apple/build-core.sh
        env:
          WEFT_APPLE_SDKS: iphonesimulator
      - run: pnpm --filter example build:ios
        env:
          WEFT_NATIVE: "0"
      - run: pnpm --filter example test:ios

  # The screenshot jobs run where the baselines are recorded: the `web`
  # container, Xcode 27.2 and its iOS 27.2 iPhone 17, and a Pixel 10 screen
  # on Android 37.
  web-shots:
    needs: wasm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: compiler-wasm
          path: packages/compiler/wasm
      # Root, because the checkout belongs to the runner's user.
      - run: docker compose -f native/linux/docker/compose.yaml run --rm --user root web sh -c 'pnpm install --frozen-lockfile && pnpm --filter example shot:web'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: web-shots
          path: |
            example/screenshots/actual
            example/screenshots/diff
          retention-days: 7

  ios-shots:
    needs: wasm
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: brew install ninja
      # A separate key from ios-ui, whose kernel is built with Xcode 26.
      - uses: actions/cache@v6
        with:
          path: |
            native/core/build
            native/apple/build
          key: apple-ios-xcode-27-${{ env.HERMES_TAG }}-${{ hashFiles('native/core/hermes.cmake', 'native/apple/build-core.sh') }}
          restore-keys: apple-ios-xcode-27-${{ env.HERMES_TAG }}-
      - run: native/apple/build-core.sh
        env:
          WEFT_APPLE_SDKS: iphonesimulator
      # The image has an iPhone 17 for each iOS runtime; pick the iOS 27.2 one.
      - run: |
          udid=$(xcrun simctl list devices available -j | jq -r '.devices["com.apple.CoreSimulator.SimRuntime.iOS-27-2"][] | select(.name == "iPhone 17") | .udid' | head -n 1)
          test -n "$udid"
          echo "WEFT_IOS_DEVICE=$udid" >> "$GITHUB_ENV"
      - run: pnpm --filter example shot:ios
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ios-shots
          path: |
            example/screenshots/actual
            example/screenshots/diff
          retention-days: 7

  android-shots:
    needs: wasm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/cache@v6
        with:
          path: |
            native/core/build
            native/android/build
          key: android-${{ env.HERMES_TAG }}-${{ hashFiles('native/core/hermes.cmake', 'native/android/CMakeLists.txt', 'native/android/build-core.sh') }}
          restore-keys: android-${{ env.HERMES_TAG }}-
      - run: native/android/build-core.sh
        env:
          WEFT_ANDROID_ABIS: x86_64
      # Build before the emulator starts: compiling next to it starves the
      # emulator until its system services restart.
      - run: pnpm --filter example build:android
        env:
          WEFT_NATIVE: "0"
      - run: example/apps/android/gradlew -p example/apps/android :app:assembleDebug :app:assembleDebugAndroidTest
      # The Google API images crash SurfaceFlinger on the runner's software
      # renderer; the ATD image, which has no system bars, does not. The
      # runner's avdmanager predates the pixel_10 profile, so give the default
      # AVD the Pixel 10 screen instead.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: "37.0"
          arch: x86_64
          target: google_atd
          cores: 4
          ram-size: 4096M
          disk-size: 8G
          emulator-boot-timeout: 1200
          disable-animations: true
          pre-emulator-launch-script: printf 'hw.lcd.width=1080\nhw.lcd.height=2424\nhw.lcd.density=420\n' >> "${ANDROID_AVD_HOME:-$HOME/.android/avd}/test.avd/config.ini"
          script: |
            for i in $(seq 150); do adb shell 'ls /sdcard/Android && pm path android' >/dev/null 2>&1 && break; sleep 2; done
            pnpm --filter example shot:android
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-shots
          path: |
            example/screenshots/actual
            example/screenshots/diff
          retention-days: 7
