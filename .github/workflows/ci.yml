# Checks of every pull request, on every platform. The commands follow the
# check codes of docs/PLAN.md (C-rust, C-ts, C-core, C-linux, C-apple, C-android,
# C-windows); CONTRIBUTING.md describes them. The UI flows run nightly
# (nightly.yml).
name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Keep in sync with crates/wasm/Cargo.toml.
  WASM_BINDGEN: 0.2.130
  # Keep in sync with WEFT_HERMES_TAG in native/core/CMakeLists.txt. The kernel
  # caches are keyed on it and on the Hermes options in native/core/hermes.cmake,
  # so changes to Weft's own CMake files reuse the compiled Hermes.
  HERMES_TAG: hermes-v260318099.0.8

jobs:
  # Which jobs a change needs: a pull request that only touches docs or plans
  # skips the kernel builds. Skipped jobs count as passed for required checks.
  # Manual runs check everything.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.rust == 'true' }}
      ts: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.ts == 'true' }}
      docs: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.docs == 'true' }}
      tree_sitter: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.tree_sitter == 'true' }}
      core: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' }}
      linux: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.linux == 'true' }}
      apple: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.apple == 'true' }}
      android: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.android == 'true' }}
      windows: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.windows == 'true' }}
    steps:
      # Pushes are diffed with git; pull requests through the API.
      - if: github.event_name == 'push'
        uses: actions/checkout@v7
      - id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            kernel: &kernel
              - .github/workflows/ci.yml
              - .github/actions/**
              - protocol/**
              - native/core/**
            # The compiler and Vite plugin bundle the conformance fixtures.
            compiler: &compiler
              - crates/**
              - Cargo.toml
              - Cargo.lock
              - packages/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - tests/conformance/**
              - tests/fixtures/**
            rust:
              - .github/workflows/ci.yml
              - crates/**
              - Cargo.toml
              - Cargo.lock
            ts:
              - .github/workflows/ci.yml
              - .github/actions/**
              - protocol/**
              - crates/**
              - Cargo.toml
              - Cargo.lock
              - packages/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - tests/**
              - example/**
            docs:
              - .github/workflows/ci.yml
              - .github/actions/**
              - docs/**
              - '!docs/*.md'
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
            tree_sitter:
              - .github/workflows/ci.yml
              - packages/tree-sitter/**
              - '**/*.weft'
            core:
              - *kernel
              - *compiler
            linux:
              - *kernel
              - *compiler
              - native/linux/**
              - tests/vite/fixtures/assets/assets/**
            apple:
              - *kernel
              - native/apple/**
              - tests/vite/fixtures/assets/assets/**
              - example/assets/fonts/**
            android:
              - *kernel
              - *compiler
              - native/android/**
              - example/**
            windows:
              - *kernel
              - *compiler
              - native/windows/**

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: |
          cargo fmt --manifest-path crates/zed/Cargo.toml --check
          cargo check --manifest-path crates/zed/Cargo.toml --target wasm32-wasip2
          cargo clippy --manifest-path crates/zed/Cargo.toml --target wasm32-wasip2 -- -D warnings

  tree-sitter:
    needs: changes
    if: needs.changes.outputs.tree_sitter == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: tree-sitter-cli
      - run: cd packages/tree-sitter && tree-sitter test
      - run: packages/tree-sitter/test/fixtures.sh

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter docs
      - run: pnpm --filter docs build

  # The compiler WASM of @weft-ui/compiler, shared by every job that compiles
  # .weft files.
  wasm:
    needs: changes
    if: >-
      needs.changes.outputs.ts == 'true' ||
      needs.changes.outputs.core == 'true' ||
      needs.changes.outputs.linux == 'true' ||
      needs.changes.outputs.apple == 'true' ||
      needs.changes.outputs.android == 'true' ||
      needs.changes.outputs.windows == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN }}
      # The build:wasm script of packages/compiler, without installing the workspace.
      - run: cargo build -p weft-ui-wasm --release --target wasm32-unknown-unknown
      - run: wasm-bindgen --target web --out-dir packages/compiler/wasm --out-name weft_ui_wasm target/wasm32-unknown-unknown/release/weft_ui_wasm.wasm
      - uses: actions/upload-artifact@v7
        with:
          name: compiler-wasm
          path: packages/compiler/wasm
          retention-days: 3

  ts:
    needs: [changes, wasm]
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: pnpm -r --filter "./packages/*" build
      - run: pnpm --filter example exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm test

  core:
    needs: [changes, wasm]
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - uses: actions/cache@v6
        with:
          path: native/core/build
          key: core-linux-${{ env.HERMES_TAG }}-${{ hashFiles('native/core/hermes.cmake') }}
          restore-keys: core-linux-${{ env.HERMES_TAG }}-
      - run: cmake -S native/core -B native/core/build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build native/core/build
      - run: ctest --test-dir native/core/build --output-on-failure

  linux:
    needs: [changes, wasm]
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: compiler-wasm
          path: packages/compiler/wasm
      - uses: actions/cache@v6
        with:
          path: native/linux/build/linux-x64
          key: linux-x64-${{ env.HERMES_TAG }}-${{ hashFiles('native/core/hermes.cmake', 'native/linux/build-core.sh') }}
          restore-keys: linux-x64-${{ env.HERMES_TAG }}-
      # The container's user (ubuntu, uid 1000) writes to the mounted workspace.
      - run: sudo chown -R 1000:1000 "$GITHUB_WORKSPACE"
      # The shell tests use the Dockerfile's Fontconfig and GdkPixbuf SVG loader.
      - run: docker compose -f native/linux/docker/compose.yaml up -d --build
      - name: C-linux
        run: |
          docker compose -f native/linux/docker/compose.yaml exec -T linux bash -lc '
            set -euo pipefail
            pnpm install --frozen-lockfile
            native/linux/build-core.sh
            cmake -S native/linux -B /tmp/weft-linux-tests -G Ninja -DWEFT_LINUX_TESTS=ON
            cmake --build /tmp/weft-linux-tests
            ctest --test-dir /tmp/weft-linux-tests --output-on-failure'
      # Let the cache step read and save what the container wrote.
      - if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

  apple:
    needs: [changes, wasm]
    if: needs.changes.outputs.apple == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: brew install ninja
      - uses: actions/cache@v6
        with:
          path: |
            native/core/build
            native/apple/build
          key: apple-${{ env.HERMES_TAG }}-${{ hashFiles('native/core/hermes.cmake', 'native/apple/build-core.sh') }}
          restore-keys: apple-${{ env.HERMES_TAG }}-
      - run: native/apple/build-core.sh
        env:
          WEFT_APPLE_SDKS: macosx
      - run: swift test --package-path native/apple

  android:
    needs: [changes, wasm]
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - uses: actions/cache@v6
        with:
          path: |
            native/core/build
            native/android/build
          key: android-${{ env.HERMES_TAG }}-${{ hashFiles('native/core/hermes.cmake', 'native/android/CMakeLists.txt', 'native/android/build-core.sh') }}
          restore-keys: android-${{ env.HERMES_TAG }}-
      - run: native/android/build-core.sh
        env:
          WEFT_ANDROID_ABIS: x86_64
      - run: pnpm --filter example build:android
        env:
          WEFT_NATIVE: "0"
      - run: example/apps/android/gradlew -p example/apps/android :weft-android:testDebugUnitTest

  windows:
    needs: [changes, wasm]
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v6
        with:
          path: native/core/build-windows
          key: windows-x64-${{ env.HERMES_TAG }}-${{ hashFiles('native/core/hermes.cmake') }}
          restore-keys: windows-x64-${{ env.HERMES_TAG }}-
      # One Hermes build: the kernel tests build weft_core.dll as build-core.ps1
      # does (shared, static MSVC runtime), so the tested DLL is the shipped
      # configuration. Weft.WinUI.Tests does not load the DLL.
      - name: Kernel tests and conformance (shared library)
        run: |
          # The C++ toolchain and the CMake and Ninja that come with Visual Studio, as build-core.ps1 sets them up.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64' | Out-Null
          $tools = "$vs\Common7\IDE\CommonExtensions\Microsoft\CMake"
          $env:PATH = "$tools\CMake\bin;$tools\Ninja;$env:PATH"
          cmake -S native/core -B native/core/build-windows -G Ninja -DCMAKE_BUILD_TYPE=Release -DWEFT_CORE_SHARED=ON `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_POLICY_DEFAULT_CMP0091=NEW
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build native/core/build-windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir native/core/build-windows --output-on-failure
      - run: dotnet test native/windows/Weft.WinUI.Tests -nologo
