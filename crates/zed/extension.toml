# Zed clones this commit and builds `path`; point `rev` at the latest commit that changed the grammar.
[grammars.weft]
repository = "https://github.com/weft-ui/weft-ui"
rev = "d1773e9a190814ec59f3e7f3f03f730dc47102fa"
path = "packages/tree-sitter"
